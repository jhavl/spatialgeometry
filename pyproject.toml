[project]

name = "spatialgeometry"

description = "A Shape and Geometry Description Package"

version = "1.4.0"

authors = [
    { name = "Jesse Haviland", email = "j.haviland@qut.edu.au" },
    { name = "Peter Corke", email = "rvc@petercorke.com" },
]

dependencies = ["spatialmath-python>=1.0.0"]


license = { file = "LICENSE" }

readme = "README.md"

requires-python = ">=3.10"

keywords = [
    "python",
    "robotics",
    "robotics-toolbox",
    "kinematics",
    "dynamics",
    "motion-planning",
    "trajectory-generation",
    "jacobian",
    "hessian",
    "control",
    "simulation",
    "robot-manipulator",
    "mobile-robot",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    # Indicate who your project is intended for
    "Intended Audience :: Developers",
    # Pick your license as you wish (should match "license" above)
    "License :: OSI Approved :: MIT License",
    # Specify the Python versions you support here.
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]


[project.urls]
homepage = "https://github.com/jhavl/spatialgeometry"
documentation = "https://jhavl.github.io/spatialgeometry/"
repository = "https://github.com/jhavl/spatialgeometry"


[project.optional-dependencies]

# trimesh has no Windows-wheel problem of its own -- split out from collision
# so mesh-only functionality (e.g. Mesh.corners()/bounds()/extents(), which
# needs trimesh to read a mesh file's vertices but never touches Coal at
# all) doesn't force in coal, which currently has no Windows wheel at all
# (see coal-library/coal#793).
mesh = ["trimesh"]

collision = ["spatialgeometry[mesh]", "coal; sys_platform != 'win32'", "pycollada"]

dev = [
    "black",
    "editables",
    "pytest",
    "pytest-cov",
    "flake8",
    "pyyaml",
    "coal; sys_platform != 'win32'",
    "trimesh",
]

docs = ["sphinx", "sphinx_rtd_theme", "sphinx-pyrunblock", "sphinx-copybutton", "sphinx-codeautolink", "sphinxcontrib-mermaid"]


[build-system]

requires = ["scikit-build-core>=0.9", "nanobind>=2"]
build-backend = "scikit_build_core.build"


[tool.scikit-build]
wheel.packages = ["src/spatialgeometry"]
sdist.include = [
    "src/spatialgeometry",
    "tests",
    "CMakeLists.txt",
    "README.md",
    "LICENSE",
]

# Set SG_PURE_WHEEL=1 to build a genuinely pure-Python wheel: skips the
# compiled nanobind extension (CMakeLists.txt's SG_BUILD_EXTENSIONS option)
# and forces the wheel tag to py3-none-any (wheel.platlib=false --
# root_is_purelib forces plats=["any"], abi="none", pyvers=["py3"], per
# scikit-build-core's wheel_tag.py). Used for the Pyodide/JupyterLite
# build -- spatialgeometry.scene already has a complete pure-Python
# fallback (scene.py), so there's nothing missing at runtime. This is the
# same content the old cibuildwheel-Pyodide cross-compile produced (that
# path already skipped nanobind_add_module() under Emscripten and fell
# back to scene.py too) -- the only change here is that the wheel is
# honestly tagged py3-none-any instead of cp312-cp312-pyodide_wasm32, so
# `pip`/`micropip` resolve it automatically with no GitHub-Release-asset
# fetch or CPython-version pinning required downstream. pip always
# prefers a platform-specific compiled wheel over py3-none-any when both
# are published -- this wheel is only ever selected where no compiled
# wheel exists, i.e. Pyodide today.
[[tool.scikit-build.overrides]]
if.env.SG_PURE_WHEEL = true
wheel.platlib = false
cmake.define.SG_BUILD_EXTENSIONS = "OFF"


[tool.black]

line-length = 88
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | \.github
    | _build
    | buck-out
    | build
    | dist
    | docs
  )/
)
'''


[tool.flake8]

max-line-length = 88
extend-ignore = 'E203'


[tool.cibuildwheel]

# Will cause the wheel to be installed with `pip install <wheel_file>[dev,collision]`
# test-extras = ["dev", "collision"]
# test-requires = "pytest"
# test-command = "pytest {project}/tests"

manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"

# Build CPython
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*"]

# Disable building musllinux wheels on all platforms
skip = ["pp*", "*musllinux*"]


[tool.cibuildwheel.macos]

# Build `x86_64` and `arm64` wheels on an Intel runner.
# Note that the `arm64` wheel cannot be tested in this configuration.
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.linux]

# On an Linux Intel runner with qemu installed, build Intel and ARM wheels
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.windows]

# On an Windows Intel runner build wheels
archs = ["AMD64", "x86"]

# No [tool.cibuildwheel.pyodide] section -- the wasm/Pyodide wheel is no
# longer built via cibuildwheel's Pyodide platform (that meant a full
# Emscripten SDK cross-compile job just to produce content that was
# already pure Python underneath). It's built as an ordinary pure-Python
# wheel on a normal runner instead -- see the SG_PURE_WHEEL override in
# [tool.scikit-build] above and cibuildwheel.yml's build_pyodide job.
