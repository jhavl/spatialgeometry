[project]

name = "spatialgeometry"

description = "A Shape and Geometry Description Package"

version = "1.3.0"

authors = [
    { name = "Jesse Haviland", email = "j.haviland@qut.edu.au" },
    { name = "Peter Corke", email = "rvc@petercorke.com" },
]

dependencies = ["spatialmath-python>=1.0.0"]


license = { file = "LICENSE" }

readme = "README.md"

requires-python = ">=3.10"

keywords = [
    "python",
    "robotics",
    "robotics-toolbox",
    "kinematics",
    "dynamics",
    "motion-planning",
    "trajectory-generation",
    "jacobian",
    "hessian",
    "control",
    "simulation",
    "robot-manipulator",
    "mobile-robot",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    # Indicate who your project is intended for
    "Intended Audience :: Developers",
    # Pick your license as you wish (should match "license" above)
    "License :: OSI Approved :: MIT License",
    # Specify the Python versions you support here.
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]


[project.urls]
homepage = "https://github.com/jhavl/spatialgeometry"
documentation = "https://jhavl.github.io/spatialgeometry/"
repository = "https://github.com/jhavl/spatialgeometry"


[project.optional-dependencies]

collision = ["coal; sys_platform != 'win32'", "trimesh", "pycollada"]

dev = [
    "black",
    "editables",
    "pytest",
    "pytest-cov",
    "flake8",
    "pyyaml",
    "coal; sys_platform != 'win32'",
    "trimesh",
]

docs = ["sphinx", "sphinx_rtd_theme", "sphinx-pyrunblock", "sphinx-copybutton", "sphinx-codeautolink", "sphinxcontrib-mermaid"]


[build-system]

requires = ["scikit-build-core>=0.9", "nanobind>=2"]
build-backend = "scikit_build_core.build"


[tool.scikit-build]
wheel.packages = ["src/spatialgeometry"]
sdist.include = [
    "src/spatialgeometry",
    "tests",
    "CMakeLists.txt",
    "README.md",
    "LICENSE",
]


[tool.black]

line-length = 88
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | \.github
    | _build
    | buck-out
    | build
    | dist
    | docs
  )/
)
'''


[tool.flake8]

max-line-length = 88
extend-ignore = 'E203'


[tool.cibuildwheel]

# Will cause the wheel to be installed with `pip install <wheel_file>[dev,collision]`
# test-extras = ["dev", "collision"]
# test-requires = "pytest"
# test-command = "pytest {project}/tests"

manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"

# Build CPython
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*"]

# Disable building musllinux wheels on all platforms
skip = ["pp*", "*musllinux*"]


[tool.cibuildwheel.macos]

# Build `x86_64` and `arm64` wheels on an Intel runner.
# Note that the `arm64` wheel cannot be tested in this configuration.
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.linux]

# On an Linux Intel runner with qemu installed, build Intel and ARM wheels
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.windows]

# On an Windows Intel runner build wheels
archs = ["AMD64", "x86"]

[tool.cibuildwheel.pyodide]
# Pyodide (wasm32-emscripten) -- used by JupyterLite. cibuildwheel manages
# the Emscripten SDK; scikit-build-core picks up the toolchain file
# automatically from the PYODIDE environment. CMakeLists.txt's
# CMAKE_SYSTEM_NAME == "Emscripten" guard skips nanobind_add_module()
# entirely here, so this produces a genuine pure-Python wheel that falls
# back to scene.py -- no manual env var needed to opt out of compiling.
