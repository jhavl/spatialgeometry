# Run tests and build/deploy docs.
# Triggers on pushes to main and on PRs targeting main.

name: Run Tests and Build Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Test with pytest
        run: |
          pip install .[dev,collision]
          pip install pytest-timeout
          pytest --timeout=30 --timeout_method thread -s

  rtb-integration:
    # Exercises the RTB-dependent tests in test_Shape.py (test_mesh,
    # test_robot, test_robot2) that are skipped everywhere else --
    # roboticstoolbox is deliberately not in the dev extra (installing a
    # published RTB release alongside this package caused real file-
    # clobbering collisions, both vendor a package at the same
    # `spatialgeometry` import path). Installs RTB from a branch instead
    # of PyPI until RTB 1.4.0 (which drops its own vendored copy) ships;
    # swap this for a normal version-pinned PyPI install once it does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install spatialgeometry, then RTB from source
        run: |
          pip install -e .[collision]
          pip install pytest
          pip install git+https://github.com/petercorke/robotics-toolbox-python.git@fix/drop-vendored-spatialgeometry
      - name: Test with pytest
        # Runs the full suite (not just the RTB-dependent tests) so the
        # skip_no_rtb-gated tests get real coverage here, matching how
        # they'd behave for any dev who has both packages installed.
        run: pytest tests/ -v

  codecov:
    # If all tests pass:
    # Run coverage and upload to codecov
    needs: unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Run coverage
        run: |
          pip install -e .[dev,collision]
          pytest --cov=spatialgeometry --cov-report xml:coverage.xml
          coverage report
      - name: upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  docs-build:
    needs: unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          pip install .[docs]
          pip install sympy
          sudo apt-get install -y graphviz

      - name: Build docs
        run: |
          cd docs && make html
          touch build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  # Separate job so the github-pages environment (and its deployment
  # protection rules restricting it to main) is only ever touched on main —
  # a job-level `environment:` triggers a deployment attempt as soon as the
  # job starts, regardless of any step-level `if:`, so PR runs would
  # otherwise show a false "failed to deploy to github-pages".
  docs-deploy:
    needs: docs-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
