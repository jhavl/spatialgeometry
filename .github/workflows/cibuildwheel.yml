# Build wheels for all platforms and publish to PyPI.
#
# To ship a release: bump the version in pyproject.toml, merge that to
# main, then on GitHub go to Releases -> "Draft a new release", pick a
# tag matching the new version, and click "Publish release". That single
# click is the only trigger for this workflow -- it builds every wheel
# (including a pure-Python py3-none-any wheel for Pyodide/JupyterLite)
# and uploads everything to PyPI. There is no separate manual/
# workflow_dispatch path, so there's only one way to publish and it
# always does the full job.
#
# Uses OIDC trusted publishing -- no stored PyPI token required.

name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build_wheels:
    name: Build compiled wheels on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: x86_64
          - os: macos-latest
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD_VERBOSITY: 1
          # Only build CPython 3.10-3.14; skip PyPy and free-threaded builds.
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "pp* cp313t-* cp314t-* *musllinux*"
          # Only build for this runner's native arch (no QEMU cross-compilation).
          CIBW_ARCHS: native

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_pyodide:
    name: Build pure-Python wheel (for Pyodide/JupyterLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pure-Python wheel
        run: |
          pip install build
          SG_PURE_WHEEL=1 python3 -m build --wheel --outdir wheelhouse

      - name: Verify wheel is genuinely pure Python
        run: |
          ls wheelhouse/
          case "$(ls wheelhouse/)" in
            *-py3-none-any.whl) echo "OK: py3-none-any" ;;
            *) echo "ERROR: expected a py3-none-any wheel"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-pyodide
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_pyodide, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
